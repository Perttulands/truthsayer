name: Truthsayer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install C toolchain (required for tree-sitter cgo)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build
        run: go build -o truthsayer ./cmd/truthsayer
        env:
          CGO_ENABLED: "1"

      - name: Test
        run: go test ./... -count=1

      - name: Race detector (scanners)
        run: go test -race ./internal/scanner/... -count=1

  scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install C toolchain (required for tree-sitter cgo)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build
        run: go build -o truthsayer ./cmd/truthsayer
        env:
          CGO_ENABLED: "1"

      - name: Truthsayer scan (JSON report)
        run: ./truthsayer scan --format json . > truthsayer-report.json
        continue-on-error: true

      - name: Truthsayer scan (quality gate)
        run: ./truthsayer scan .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truthsayer-report
          path: truthsayer-report.json
