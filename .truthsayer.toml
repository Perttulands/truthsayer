[scan]
exclude_dirs = ["vendor", "node_modules", "testdata", ".beads"]
exclude_patterns = [
  "*_test.go",
  "truthsayer-report.json",
  "internal/engine/benchmark_test.go",
]

[rules]
disable = [
  "security.command-injection",
  "security.sql-injection",
  "config-smells.hardcoded-credentials",
  "bad-defaults.unvalidated-env-bash",
]
